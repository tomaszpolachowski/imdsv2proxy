name: firewall

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - id: toLowerCase
        run: echo "::set-output name=repository::${UPPERCASE_VAR,,}"
        env:
          UPPERCASE_VAR: ${{ github.repository }}
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          tags: ghcr.io/${{ steps.toLowerCase.outputs.repository }}/firewall:latest
          context: firewall
          containerfiles: firewall/Containerfile
          oci: true
      - name: Push
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ steps.toLowerCase.outputs.repository }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
