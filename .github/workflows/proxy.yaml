name: proxy

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - id: toLowerCase
        run: echo "::set-output name=repository::${UPPERCASE_VAR,,}"
        env:
          UPPERCASE_VAR: ${{ github.repository }}
      - name: Checkout
        uses: actions/checkout@v2
      # - name: Login to GHCR
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v1
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.repository_owner }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      # - name: Build and push
      #   uses: docker/build-push-action@v2
      #   with:
      #     context: proxy
      #     file: proxy/Containerfile
      #     push: ${{ github.event_name != 'pull_request' }}
      #     tags: ghcr.io/${{ steps.toLowerCase.outputs.repository }}/proxy:latest
      - name: Build
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          tags: ghcr.io/${{ steps.toLowerCase.outputs.repository }}/proxy:latest
          context: proxy
          containerfiles: proxy/Containerfile
      - name: Push
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ steps.toLowerCase.outputs.repository }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
